; Gateway Agent Python (opsional jika tidak memakai systemd rental-gateway-agent.service)

[program:rental-gateway-agent]
process_name=%(program_name)s
command=/var/www/html/Laravel-Rental-Manager/gateway-agent/run.sh
directory=/var/www/html/Laravel-Rental-Manager/gateway-agent
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
environment=RGA_SKIP_APACHE_RELOAD="false",RGA_SKIP_CONFIGTEST="false"
redirect_stderr=true
stdout_logfile=/var/log/supervisor/rental-gateway-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
