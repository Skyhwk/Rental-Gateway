; Laravel scheduler (schedule:work) — jangan pasang cron schedule:run bersamaan
; Install: sudo cp deploy/supervisor/*.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update

[program:rental-manager-schedule]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/Laravel-Rental-Manager/artisan schedule:work
directory=/var/www/html/Laravel-Rental-Manager
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/rental-manager-schedule.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
