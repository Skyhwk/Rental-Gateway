; Queue worker — ApplyGatewayConfigJob dan job ShouldQueue lainnya
; Wajib QUEUE_CONNECTION=database (atau redis) di .env

[program:rental-manager-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/Laravel-Rental-Manager/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/html/Laravel-Rental-Manager
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/rental-manager-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
