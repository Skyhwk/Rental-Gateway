# Panel Rental Manager — DocumentRoot = Laravel public/
# Pasang: sudo bash deploy/install-apache-rental-manager.sh

Listen 5152

<VirtualHost *:5152>
    ServerName bromo
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/Laravel-Rental-Manager/public

    <Directory /var/www/html/Laravel-Rental-Manager/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/rental-manager-error.log
    CustomLog ${APACHE_LOG_DIR}/rental-manager-access.log combined
</VirtualHost>
