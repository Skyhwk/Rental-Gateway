<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
        <title>Pemeliharaan</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background: #f4f6f9;
                color: #343a40;
                padding: 1.5rem;
            }

            .card {
                max-width: 480px;
                width: 100%;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
                padding: 2rem;
                text-align: center;
            }

            h1 {
                font-size: 1.35rem;
                margin: 0 0 1rem;
                color: #856404;
            }

            p {
                margin: 0;
                line-height: 1.6;
                color: #6c757d;
                font-size: 1rem;
            }

            .icon {
                font-size: 3rem;
                margin-bottom: 1rem;
                opacity: .85;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="icon" aria-hidden="true">&#128736;</div>
            <h1>Sedang Dalam Pemeliharaan</h1>
            <p>Aplikasi sedang dalam pemeliharaan. Silakan coba beberapa saat lagi.</p>
        </div>
    </body>
</html>
